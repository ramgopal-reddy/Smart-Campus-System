{% extends "base.html" %}
{% load static %}
{% block content %}
<div class="container mt-5">
  <div class="text-center mb-5 animate__animated animate__fadeInDown">
    <h1 class="display-5 fw-bold gradient-text mb-3">Make-up Attendance</h1>
    <p class="lead text-muted">Mark your attendance for make-up classes using remedial codes</p>
  </div>

  <div class="row">
    <div class="col-lg-8 mx-auto">
      <div class="card shadow-lg animate__animated animate__fadeInUp">
        <div class="card-header bg-info text-white">
          <h4 class="mb-0">
            <i class="bi bi-check-circle me-2"></i>Mark Make-up Attendance
          </h4>
        </div>
        <div class="card-body p-4">
          <form id="makeupAttendanceForm">
            <div class="row g-3">
              <div class="col-md-6">
                <label for="rollNumber" class="form-label fw-semibold">
                  <i class="bi bi-hash me-1"></i>Roll Number
                </label>
                <input type="text" id="rollNumber" class="form-control" placeholder="Enter your roll number" required>
              </div>
              <div class="col-md-6">
                <label for="remedialCode" class="form-label fw-semibold">
                  <i class="bi bi-ticket-perforated me-1"></i>Remedial Code
                </label>
                <input type="text" id="remedialCode" class="form-control" placeholder="Enter 8-character remedial code" required maxlength="8">
              </div>
            </div>
            
            <div class="row mt-4">
              <div class="col-12 text-center">
                <button type="button" class="btn btn-info btn-lg" onclick="markMakeupAttendance()">
                  <i class="bi bi-check-circle me-2"></i>Mark Attendance
                </button>
              </div>
            </div>
          </form>

          <!-- Attendance History -->
          <div class="mt-5">
            <h5 class="mb-3">
              <i class="bi bi-clock-history me-2"></i>Your Make-up Attendance History
            </h5>
            <div class="table-responsive">
              <table class="table table-hover">
                <thead class="table-dark">
                  <tr>
                    <th><i class="bi bi-hash me-1"></i>Class ID</th>
                    <th><i class="bi bi-calendar me-1"></i>Date</th>
                    <th><i class="bi bi-check-circle me-1"></i>Status</th>
                  </tr>
                </thead>
                <tbody id="attendanceHistoryBody">
                  <!-- Attendance history will be loaded here -->
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="{% static 'js/makeup-attendance.js' %}"></script>
{% endblock %}
