{% extends "base.html" %}
{% load static %}
{% block content %}

<div class="container mt-5">
  <div class="row">
    <div class="col-lg-8 mx-auto">

      <!-- Food Order Form -->
      <div class="card shadow-lg">
        <div class="card-header bg-success text-white">
          <h4 class="mb-0">
            <i class="bi bi-cup-hot me-2"></i>Food Pre-Order
          </h4>
        </div>

        <div class="card-body p-4">
          <form id="foodOrderForm">

            <div class="row g-3">

              <div class="col-md-6">
                <label class="form-label fw-semibold">Student Name</label>
                <input type="text" id="student_name" class="form-control" required>
              </div>

              <div class="col-md-6">
                <label class="form-label fw-semibold">Student Email</label>
                <input type="email" id="student_email" class="form-control" required>
              </div>

              <div class="col-12">
                <label class="form-label fw-semibold">Food Item</label>
                <select id="food_item" class="form-select" required>
                  <option value="">Select item</option>
                  <option value="Biryani">Biryani - ₹120</option>
                  <option value="Thali">Thali - ₹100</option>
                  <option value="Noodles">Noodles - ₹80</option>
                  <option value="Sandwich">Sandwich - ₹60</option>
                  <option value="Pizza">Pizza - ₹150</option>
                  <option value="Burger">Burger - ₹90</option>
                </select>
              </div>

              <div class="col-12">
                <label class="form-label fw-semibold">Preferred Time</label>
                <select id="break_time" class="form-select" required>
                  <option value="">Select time slot</option>
                  <option value="8:00-9:00">Breakfast (8:00-9:00)</option>
                  <option value="12:00-1:00">Lunch (12:00-1:00)</option>
                  <option value="6:00-7:00">Dinner (6:00-7:00)</option>
                </select>
              </div>

              <div class="col-12 mt-3">
                <button type="button" id="orderBtn" class="btn btn-success btn-lg">
                  <i class="bi bi-cart-plus me-2"></i>Place Order
                </button>
              </div>

            </div>
          </form>
        </div>
      </div>

      <!-- History Section -->
      <div class="card shadow-lg mt-4">
        <div class="card-header bg-warning text-dark">
          <h4 class="mb-0">
            <i class="bi bi-receipt me-2"></i>Food Order History
          </h4>
        </div>
        <div class="card-body">
          <div id="foodHistory" class="table-responsive text-center text-muted">
            Loading...
          </div>
        </div>
      </div>

    </div>
  </div>
</div>

<script src="{% static 'js/food.js' %}"></script>

{% endblock %}
