{% extends "base.html" %} {% load static %} {% block content %}
<div class="container mt-5">
  <div class="text-center mb-5 animate__animated animate__fadeInDown">
    <h1 class="display-5 fw-bold gradient-text mb-3">Attendance Management</h1>
    <p class="lead text-muted">Mark and track student attendance efficiently</p>
  </div>

  <div class="row">
    <div class="col-lg-8 mx-auto">
      <div class="card border-0 shadow-lg animate__animated animate__fadeInUp">
        <div class="card-body p-5">
          <h4 class="card-title mb-4 fw-bold">Mark Attendance</h4>
          
          <form id="attendanceForm">
            <div class="row g-3">
              <div class="col-md-6">
                <label for="roll" class="form-label fw-semibold">
                  <i class="bi bi-hash me-1"></i>Roll Number
                </label>
                <input
                  type="text"
                  id="roll"
                  class="form-control"
                  placeholder="Enter Roll Number"
                  required
                />
              </div>
              
              <div class="col-md-6">
                <label for="status" class="form-label fw-semibold">
                  <i class="bi bi-toggle-on me-1"></i>Attendance Status
                </label>
                <select id="status" class="form-select">
                  <option value="Present">Present</option>
                  <option value="Absent">Absent</option>
                  <option value="Late">Late</option>
                </select>
              </div>
              
              <div class="col-12">
                <label for="email" class="form-label fw-semibold">
                  <i class="bi bi-envelope me-1"></i>Student Email
                </label>
                <input
                  type="email"
                  id="student_email"
                  class="form-control"
                  placeholder="student@lpu.in"
                  required
                />
              </div>
              
              <div class="col-12">
                <button type="button" class="btn btn-primary btn-lg" onclick="markAttendance()">
                  <i class="bi bi-check2-circle me-2"></i>Submit Attendance
                </button>
                <button type="reset" class="btn btn-outline-secondary btn-lg ms-2">
                  <i class="bi bi-arrow-clockwise me-2"></i>Reset
                </button>
              </div>
            </div>
          </form>
        </div>
      </div>

      <div class="card shadow-lg mt-4 animate__animated animate__fadeInUp">
        <div class="card-header bg-info text-white">
          <h4 class="mb-0">
            <i class="bi bi-clock-history me-2"></i>Attendance History
          </h4>
        </div>
        <div class="card-body">
          <div id="history" class="table-responsive">
            <p class="text-muted text-center">No attendance records found</p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="{% static 'js/attendance.js' %}"></script>
{% endblock %}
