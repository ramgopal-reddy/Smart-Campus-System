{% extends "base.html" %}
{% load static %}
{% block content %}
<div class="container mt-5">
  <div class="text-center mb-5 animate__animated animate__fadeInDown">
    <h1 class="display-5 fw-bold gradient-text mb-3">Course Management</h1>
    <p class="lead text-muted">Manage course information and scheduling</p>
  </div>

  <div class="row">
    <div class="col-lg-10 mx-auto">
      <div class="card shadow-lg animate__animated animate__fadeInUp">
        <div class="card-header bg-info text-white">
          <h4 class="mb-0">
            <i class="bi bi-book me-2"></i>Course Directory
          </h4>
        </div>
        <div class="card-body p-4">
          <!-- Search and Filter -->
          <div class="row mb-4">
            <div class="col-md-6">
              <div class="input-group">
                <span class="input-group-text">
                  <i class="bi bi-search"></i>
                </span>
                <input type="text" id="courseSearch" class="form-control" placeholder="Search courses..." onkeyup="searchCourses()">
              </div>
            </div>
            <div class="col-md-3">
              <select id="departmentFilter" class="form-select">
                <option value="">All Departments</option>
                <option value="Computer Science">Computer Science</option>
                <option value="Electronics">Electronics</option>
                <option value="Mechanical">Mechanical</option>
                <option value="Civil">Civil</option>
                <option value="Business">Business</option>
              </select>
            </div>
            <div class="col-md-3">
              <button class="btn btn-info w-100" onclick="addCourse()">
                <i class="bi bi-plus-circle me-1"></i>Add Course
              </button>
            </div>
          </div>

          <!-- Course Table -->
          <div class="table-responsive">
            <table class="table table-hover">
              <thead class="table-dark">
                <tr>
                  <th>Course Code</th>
                  <th>Course Name</th>
                  <th>Weekly Hours</th>
                  <th><i class="bi bi-gear me-1"></i>Actions</th>
                </tr>
              </thead>
              <tbody id="courseTableBody">
                <!-- Course records will be loaded here -->
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Add Course Modal -->
<div class="modal fade" id="courseModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header bg-info text-white">
        <h5 class="modal-title">
          <i class="bi bi-plus-circle me-2"></i>Add Course
        </h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="courseForm">
          <div class="mb-3">
            <label for="courseCode" class="form-label fw-semibold">
              <i class="bi bi-hash me-1"></i>Course Code
            </label>
            <input type="text" id="courseCode" class="form-control" required>
          </div>
          <div class="mb-3">
            <label for="courseName" class="form-label fw-semibold">
              <i class="bi bi-book me-1"></i>Course Name
            </label>
            <input type="text" id="courseName" class="form-control" required>
          </div>
          <div class="mb-3">
            <label for="weekly_hours" class="form-label">Weekly Hours</label>
            <input type="number" class="form-control" id="weekly_hours" min="1" required>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-success" onclick="saveCourse()">
              <i class="bi bi-check-circle me-2"></i>Save Course
            </button>
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">
              <i class="bi bi-x-circle me-2"></i>Cancel
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

<script src="{% static 'js/courses.js' %}"></script>
{% endblock %}
