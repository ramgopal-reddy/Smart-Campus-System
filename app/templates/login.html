{% extends "base.html" %}
{% load static %}
{% block content %}
<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-4">
      <div class="card shadow-lg animate__animated animate__fadeInUp">
        <div class="card-header bg-gradient-primary text-white text-center py-3">
          <h4 class="mb-0">
            <i class="bi bi-person-circle me-2"></i>Login
          </h4>
        </div>
        <div class="card-body p-4">
          <form id="loginForm">
            <div class="mb-3">
              <label for="email" class="form-label fw-semibold">
                <i class="bi bi-envelope me-1"></i>Email Address
              </label>
              <input type="email" id="email" class="form-control" autocomplete="username" required>
            </div>
            <div class="mb-3">
              <label for="password" class="form-label fw-semibold">
                <i class="bi bi-lock me-1"></i>Password
              </label>
              <input type="password" id="password" class="form-control" autocomplete="current-password" required>
            </div>
            <div class="mb-3 form-check">
              <input type="checkbox" id="rememberMe" class="form-check-input">
              <label for="rememberMe" class="form-check-label">Remember me</label>
            </div>
            <div class="d-grid">
              <button type="submit" class="btn btn-primary btn-lg">
                <i class="bi bi-box-arrow-in-right me-2"></i>Login
              </button>
            </div>
          </form>
          
          <div class="text-center mt-3">
            <p class="mb-0">Don't have an account? 
              <a href="{% url 'register_page' %}" class="text-primary text-decoration-none">
                Register here
              </a>
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="{% static 'js/home.js' %}"></script>
{% endblock %}
