{% extends "base.html" %}
{% load static %}
{% block content %}
<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="card shadow-lg animate__animated animate__fadeInUp">
        <div class="card-header bg-gradient-success text-white text-center py-3">
          <h4 class="mb-0">
            <i class="bi bi-person-plus me-2"></i>Register
          </h4>
        </div>
        <div class="card-body p-4">
          <form id="registerForm">
            <div class="mb-3">
              <label for="name" class="form-label fw-semibold">
                <i class="bi bi-person me-1"></i>Full Name
              </label>
              <input type="text" id="name" class="form-control" required>
            </div>
            <div class="mb-3">
              <label for="email" class="form-label fw-semibold">
                <i class="bi bi-envelope me-1"></i>Email Address
              </label>
              <input type="email" id="email" class="form-control" autocomplete="username" required>
            </div>
            <div class="mb-3">
              <label for="password" class="form-label fw-semibold">
                <i class="bi bi-lock me-1"></i>Password
              </label>
              <input type="password" id="password" class="form-control" autocomplete="new-password" required>
              <div class="form-text">Password must be at least 6 characters long</div>
            </div>
            <div class="mb-3">
              <label for="confirmPassword" class="form-label fw-semibold">
                <i class="bi bi-lock-fill me-1"></i>Confirm Password
              </label>
              <input type="password" id="confirmPassword" class="form-control" autocomplete="new-password" required>
            </div>
            <div class="mb-3">
              <label for="role" class="form-label fw-semibold">
                <i class="bi bi-person-badge me-1"></i>Role
              </label>
              <select id="role" class="form-select" required>
                <option value="">Select your role</option>
                <option value="student">Student</option>
                <option value="faculty">Faculty</option>
                <option value="admin">Admin</option>
              </select>
            </div>
            <div class="d-grid">
              <button type="submit" class="btn btn-success btn-lg">
                <i class="bi bi-person-plus me-2"></i>Register
              </button>
            </div>
          </form>
          
          <div class="text-center mt-3">
            <p class="mb-0">Already have an account? 
              <a href="{% url 'login_page' %}" class="text-success text-decoration-none">
                Login here
              </a>
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="{% static 'js/auth.js' %}"></script>
{% endblock %}
