{% extends "base.html" %} {% load static %} {% block content %}
<div class="container mt-5">
  <div class="row">
    <div class="col-12">
      <div class="card shadow-lg animate__animated animate__fadeIn">
        <div class="card-header bg-info text-white">
          <h4 class="mb-0">
            <i class="bi bi-people me-2"></i>Student Information Portal
          </h4>
        </div>
        <div class="card-body">
          <div class="row mb-4">
            <div class="col-md-6">
              <div class="input-group">
                <span class="input-group-text">
                  <i class="bi bi-search"></i>
                </span>
                <input
                  type="text"
                  id="searchInput"
                  class="form-control"
                  placeholder="Search students by name, roll number, or email..."
                  onkeyup="searchStudents()"
                />
              </div>
            </div>
            <div class="col-md-6">
              <button class="btn btn-primary btn-lg" onclick="addStudent()">
                <i class="bi bi-person-plus me-2"></i>Add New Student
              </button>
            </div>
          </div>

          <!-- Quick Actions -->
          <div class="row mb-4">
            <div class="col-12">
              <div class="d-flex gap-2 justify-content-center">
                <a href="{% url 'makeup_attendance_page' %}" class="btn btn-info">
                  <i class="bi bi-check-circle me-1"></i>Mark Make-up Attendance
                </a>
              </div>
            </div>
          </div>

          <div class="table-responsive">
            <table class="table table-hover">
              <thead class="table-dark">
                <tr>
                  <th>Roll Number</th>
                  <th>Name</th>
                  <th>Email</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="studentTableBody">
                <tr>
                  <td colspan="4" class="text-center text-muted">
                    <i class="bi bi-inbox" style="font-size: 2rem;"></i>
                    <p class="mt-2">No student records found</p>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>

          <div class="row mt-4">
            <div class="col-md-4">
              <div class="card bg-light">
                <div class="card-body text-center">
                  <h3 class="text-primary">1,234</h3>
                  <p class="mb-0">Total Students</p>
                </div>
              </div>
            </div>
            <div class="col-md-4">
              <div class="card bg-light">
                <div class="card-body text-center">
                  <h3 class="text-success">892</h3>
                  <p class="mb-0">Active Students</p>
                </div>
              </div>
            </div>
            <div class="col-md-4">
              <div class="card bg-light">
                <div class="card-body text-center">
                  <h3 class="text-warning">24</h3>
                  <p class="mb-0">Courses</p>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Student Modal -->
<div class="modal fade" id="studentModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">
          <i class="bi bi-person-plus me-2"></i>Add New Student
        </h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="studentForm">
          <div class="row g-3">
            <div class="mb-3">
              <label for="roll" class="form-label">Roll Number</label>
              <input type="text" class="form-control" id="roll" required>
            </div>
            <div class="mb-3">
              <label for="name" class="form-label">Full Name</label>
              <input type="text" class="form-control" id="name" required>
            </div>
            <div class="mb-3">
              <label for="email" class="form-label">Email Address</label>
              <input type="email" class="form-control" id="email" required>
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-primary" onclick="saveStudent()">Save Student</button>
      </div>
    </div>
  </div>
</div>

<script src="{% static 'js/students.js' %}"></script>
{% endblock %}
